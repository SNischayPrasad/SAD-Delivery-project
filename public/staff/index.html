<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FBFCFD" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#162131" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <title>Find a checklist · Tally</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23FFE45C'/%3E%3Cpath d='M8 8v16M13 8v16M18 8v16M23 8v16M5 21 26 11' stroke='%2314213D' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/tally.css">
  <link rel="stylesheet" href="/staff/staff.css">
  <script type="module" src="/staff/staff.js"></script>
</head>
<body class="app--staff staff-app">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="wordmark topbar__brand" href="#/">Tally</a>
    <div class="topbar__actions" id="topbar-actions" hidden>
      <span class="topbar__user" id="user-name"></span>
      <div id="bell-slot"></div>
      <button type="button" class="btn btn--ghost btn--sm" id="sign-out">Sign out</button>
    </div>
  </header>

  <main class="staff-view" id="main" tabindex="-1">
    <div class="page page--narrow">
      <div class="skeleton-group" aria-busy="true" aria-label="Loading">
        <span class="skeleton skeleton--title"></span>
        <span class="skeleton skeleton--block" style="--h: 56px"></span>
        <span class="skeleton skeleton--row"></span>
        <span class="skeleton skeleton--row"></span>
      </div>
    </div>
    <noscript>
      <div class="page page--narrow">
        <div class="banner banner--error" role="alert">
          <div class="banner__content">
            <p class="banner__title">JavaScript is turned off</p>
            <div class="banner__body">Tally needs JavaScript to show checklists. Turn it on in your browser settings and reload.</div>
          </div>
        </div>
      </div>
    </noscript>
  </main>

  <div class="sr-only" id="sr-live" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
